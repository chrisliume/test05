[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "test05"
version = "0.1.0"
description = "test05 project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
test05 = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
